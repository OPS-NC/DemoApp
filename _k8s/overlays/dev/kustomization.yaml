apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demoapp-dev

resources:
  - namespace.yaml
  - ../../base

nameSuffix: ""

images:
  - name: ghcr.io/ops-nc/demoapp
    newTag: dev

replicas:
  - name: demoapp
    count: 1

patches:
  - path: httproute-patch.yaml

# ── Domaine unique, injecté dans le hostname de l'HTTPRoute ──────────────
# Le patch pose "dev.demoapp.DOMAIN" ; le replacement ci-dessous remplace
# le 3e label (index 2) par la valeur de `domain`.
configMapGenerator:
  - name: demoapp-domain
    literals:
      - domain=k8s.lab.ops.nc
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

replacements:
  - source:
      kind: ConfigMap
      name: demoapp-domain
      fieldPath: data.domain
    targets:
      - select:
          kind: HTTPRoute
          name: demoapp
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 2
