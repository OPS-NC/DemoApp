apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp-redis
  labels:
    app.kubernetes.io/name: demoapp-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demoapp-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demoapp-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "60", "1", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-redis
  labels:
    app.kubernetes.io/name: demoapp-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demoapp-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
